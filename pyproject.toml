[project]
name = "ado-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karol", email = "karol.bekieszczuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
ado-mcp = "ado_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
